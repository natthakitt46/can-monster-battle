<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can Monster Battle</title>
<style>
:root{--ink:#2b2b4a;--pri:#7c4dff;--pri2:#5b8cff;--ok:#2fbf71;--bad:#ff5468;--gold:#ffc233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:'Prompt','Kanit','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(160deg,#1b1450,#3b2a8c 55%,#5b3fb0);color:var(--ink);min-height:100vh}
#app{max-width:980px;margin:0 auto}
.screen{display:none;min-height:100vh;padding:14px}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}
.panel{background:rgba(255,255,255,.95);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:16px;padding:12px 22px;color:#fff;background:linear-gradient(180deg,#8f6bff,#6a3df0);box-shadow:0 5px 0 #4a28b8,0 10px 18px rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a28b8}
.btn:disabled{filter:grayscale(.8) brightness(.9);opacity:.55;cursor:not-allowed;transform:none}
.btn.green{background:linear-gradient(180deg,#46d988,#1fa95b);box-shadow:0 5px 0 #11793f,0 10px 18px rgba(0,0,0,.25)}
.btn.orange{background:linear-gradient(180deg,#ffa14a,#f06a1d);box-shadow:0 5px 0 #b44a10,0 10px 18px rgba(0,0,0,.25)}
.btn.gray{background:linear-gradient(180deg,#9aa0c0,#6c7294);box-shadow:0 5px 0 #4a4f6c,0 10px 18px rgba(0,0,0,.25)}
.btn.red{background:linear-gradient(180deg,#ff6b7d,#e03550);box-shadow:0 5px 0 #a81e36,0 10px 18px rgba(0,0,0,.25)}
.btn.big{font-size:22px;padding:16px 34px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:#fff}
.topbar h2{font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:#fff;background:var(--pri)}
.coin{background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700}

/* title */
.stage{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.stage canvas{display:block;width:100%;height:auto}
.title-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:5%;text-align:center;color:#fff;pointer-events:none}
.title-ui>*{pointer-events:auto}
.title-ui h1{font-size:clamp(28px,6vw,60px);letter-spacing:2px;text-shadow:0 4px 0 #4a28b8,0 8px 20px rgba(0,0,0,.5);line-height:1.05}
.title-ui h2{font-size:clamp(16px,3.4vw,30px);color:#ffe066;text-shadow:0 3px 0 #b44a10;margin-top:6px}
.loadbar{width:min(360px,70%);height:16px;border-radius:9px;background:rgba(0,0,0,.4);margin-top:22px;overflow:hidden;border:2px solid rgba(255,255,255,.6)}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff8a3a)}
#loadTxt{margin:8px 0 0;font-size:14px}
#btnTap{margin-top:14px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* menu */
.menu-wrap{max-width:460px;margin:6vh auto 0;text-align:center}
.menu-wrap h1{color:#fff;font-size:34px;text-shadow:0 4px 0 #4a28b8;line-height:1.1}
.menu-wrap h2{color:#ffe066;font-size:18px;margin:6px 0 22px}
.menu-wrap .btn{display:block;width:100%;margin:12px 0}
.hint{color:#dcd6ff;font-size:13px;margin-top:14px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.mcard{position:relative;background:#fff;border-radius:18px;padding:8px 6px 10px;text-align:center;cursor:pointer;border:4px solid transparent;box-shadow:0 5px 14px rgba(0,0,0,.2);transition:transform .12s}
.mcard:hover{transform:translateY(-3px)}
.mcard canvas{width:100%;height:auto;border-radius:12px;background:linear-gradient(180deg,#eef3ff,#d9e6ff)}
.mcard b{display:block;font-size:17px}
.mcard small{color:#666}
.mcard.sel{border-color:#ffd23a;box-shadow:0 0 0 4px rgba(255,210,58,.45),0 0 24px #ffd23a}
.mcard.sel::after{content:'✔';position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.mcard.focus{outline:3px dashed #7c4dff;outline-offset:2px}
.mcard.locked{filter:none;cursor:default}
.mcard .lock{position:absolute;left:0;right:0;top:34%;font-weight:800;color:#fff;text-shadow:0 2px 4px #000}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.detail canvas{width:100%;max-width:300px;height:auto;display:block;margin:0 auto 8px;border-radius:16px;background:linear-gradient(180deg,#eef3ff,#cfe0ff)}
.detail h3{font-size:22px}
.cc{margin:6px 0;padding:6px 10px;border-radius:10px;font-weight:700}
.cc.can{background:#dcf8e8;color:#10703a}
.cc.cant{background:#ffe3e6;color:#a8203a}
.slots{display:flex;gap:8px;margin:10px 0}
.slot{flex:1;height:44px;border-radius:12px;background:#e6e8f5;border:2px dashed #aab;display:flex;align-items:center;justify-content:center;font-weight:700}
.slot.on{background:#fff7d6;border:2px solid #ffc233}

/* arenas */
.acard{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);position:relative}
.acard canvas{display:block;width:100%;height:auto}
.acard .body{padding:12px 14px 14px}
.acard.lock canvas{filter:grayscale(1) brightness(.5)}
.acard.lock .badge{position:absolute;top:30%;left:0;right:0;text-align:center;color:#fff;font-size:30px;font-weight:900;text-shadow:0 2px 6px #000}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.crystals span{font-size:24px;margin:0 2px;filter:grayscale(1) opacity(.5)}
.crystals span.on{filter:none;text-shadow:0 0 12px #8ff}

/* battle */
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;margin-bottom:8px;flex-wrap:wrap}
.bhead b{font-size:18px}
.bwrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bwrap canvas{display:block;width:100%;height:auto}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(24px,5vw,46px);font-weight:900;color:#fff;text-shadow:0 4px 0 #4a28b8,0 0 20px #000;opacity:0;pointer-events:none}
#banner.show{animation:ban 1.2s ease}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
#log{background:rgba(15,10,50,.82);color:#fff;border-radius:14px;padding:8px 12px;margin:10px 0;min-height:98px;font-size:14px;line-height:1.5}
#log div{opacity:.75}#log div:last-child{opacity:1;font-weight:700}
#log .g{color:#7dffb0}#log .b{color:#ff9aa8}#log .y{color:#ffe066}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.cmds{grid-template-columns:repeat(2,1fr)}}
.cmds .btn{padding:10px 8px;line-height:1.2}
.cmds .btn small{display:block;font-size:12px;font-weight:500;opacity:.9}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:10px 20px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,6,40,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:40;overflow:auto}
.modal-card{background:#fff;border-radius:24px;padding:20px;width:min(640px,100%);max-height:96vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.q-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-weight:700;margin-bottom:8px}
.q-text{font-size:24px;font-weight:800;margin:10px 0 14px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:17px;font-weight:700;text-align:left;border:3px solid #cfd3ee;background:#f6f7ff;border-radius:14px;padding:12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:#efeaff}
.opt.right{border-color:var(--ok);background:#dcf8e8}
.opt.wrong{border-color:var(--bad);background:#ffe3e6}
.fb{margin-top:12px;border-radius:14px;padding:12px;font-size:15px;line-height:1.5}
.fb.ok{background:#dcf8e8;color:#10593a}
.fb.no{background:#fff1d6;color:#7a4a00}
.mini{display:flex;gap:10px;align-items:center;border:3px solid #dde;border-radius:16px;padding:8px;margin:8px 0;cursor:pointer;background:#fff;width:100%;font:inherit;text-align:left;color:var(--ink)}
.mini:disabled{opacity:.45;cursor:not-allowed}
.mini canvas{width:64px;height:70px;border-radius:10px;background:#e6efff}
.bar{height:12px;border-radius:7px;background:#dde;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.xp i{background:linear-gradient(90deg,#6fb4ff,#8f6bff)}

/* complete / end */
.center{max-width:640px;margin:3vh auto 0;text-align:center}
.center .panel{margin-bottom:12px}
.big-title{font-size:34px;color:#fff;text-shadow:0 4px 0 #4a28b8;margin-bottom:12px}
.rew{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.rew span{background:#fff7d6;border-radius:12px;padding:8px 14px;font-weight:800}
.lvup{display:inline-block;background:linear-gradient(90deg,#ffc233,#ff8a3a);color:#fff;border-radius:999px;padding:2px 10px;font-weight:900;font-size:13px;animation:pulse 1s infinite}
.crystal{font-size:46px;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
#endCv{position:fixed;inset:0;pointer-events:none;z-index:5}
#end .center{position:relative;z-index:6}
</style>
</head>
<body>
<div id="app">

<section id="title" class="screen active">
  <div class="stage">
    <canvas id="titleCv" width="800" height="450"></canvas>
    <div class="title-ui">
      <h1>CAN MONSTER<br>BATTLE</h1>
      <h2>THE ABILITY ARENA</h2>
      <div class="loadbar"><i id="loadFill"></i></div>
      <p id="loadTxt">กำลังโหลด Ability World...</p>
      <button id="btnTap" class="btn big orange" hidden>แตะเพื่อเริ่มเกม ▶</button>
    </div>
  </div>
</section>

<section id="menu" class="screen">
  <div class="menu-wrap">
    <h1>CAN MONSTER<br>BATTLE</h1>
    <h2>THE ABILITY ARENA</h2>
    <button id="btnContinue" class="btn green">▶ เล่นต่อ (Continue)</button>
    <button id="btnNew" class="btn">★ เริ่มเกมใหม่ (New Game)</button>
    <button id="btnColl" class="btn orange">📖 สารานุกรมมอนสเตอร์</button>
    <button id="btnHow" class="btn gray">❓ วิธีเล่น</button>
    <div class="row">
      <button id="btnSound" class="btn gray">🔊 เสียง: เปิด</button>
      <button id="btnReset" class="btn red">🗑 Reset Save</button>
    </div>
    <p class="hint">เกมบันทึกความคืบหน้าบนเครื่องนี้เท่านั้น ไม่เก็บข้อมูลส่วนตัวของนักเรียน</p>
  </div>
</section>

<section id="team" class="screen">
  <div class="topbar"><h2>เลือกทีมมอนสเตอร์ 3 ตัว</h2><button id="btnTeamBack" class="btn gray">◀ กลับ</button></div>
  <div class="split">
    <div class="panel">
      <div class="slots" id="teamSlots"></div>
      <div class="grid" id="teamGrid"></div>
    </div>
    <div class="panel detail">
      <canvas id="prevCvT" width="300" height="230"></canvas>
      <div id="detT"></div>
    </div>
  </div>
  <div class="row" style="margin-top:14px"><button id="btnStart" class="btn green big" disabled>Start Battle ▶</button></div>
</section>

<section id="collection" class="screen">
  <div class="topbar"><h2>📖 Monster Collection</h2><button id="btnCollBack" class="btn gray">◀ กลับ</button></div>
  <div class="split">
    <div class="panel"><div class="grid" id="collGrid"></div></div>
    <div class="panel detail">
      <canvas id="prevCvC" width="300" height="230"></canvas>
      <div id="detC"></div>
    </div>
  </div>
</section>

<section id="arenas" class="screen">
  <div class="topbar">
    <h2>เลือกสนามต่อสู้</h2>
    <div class="row"><span class="coin" id="hudCoins">🪙 0</span><span class="coin crystals" id="hudCrystals"></span></div>
  </div>
  <div class="agrid" id="arenaGrid"></div>
  <div class="row" style="margin-top:16px">
    <button id="btnChangeTeam" class="btn orange">🔄 เปลี่ยนทีม</button>
    <button id="btnArBack" class="btn gray">◀ เมนูหลัก</button>
  </div>
</section>

<section id="battle" class="screen">
  <div class="bhead">
    <b id="bTitle"></b>
    <span id="bProg"></span>
    <span class="row"><button id="btnBSound" class="btn gray" style="padding:6px 12px;font-size:14px">🔊</button><button id="btnQuit" class="btn red" style="padding:6px 12px;font-size:14px">ออกจากสนาม</button></span>
  </div>
  <div class="bwrap">
    <canvas id="bcv" width="800" height="440"></canvas>
    <div id="banner"></div>
  </div>
  <div id="log"></div>
  <div class="cmds">
    <button id="btnAtk" class="btn red">⚔ Attack<small>พลังโจมตี ●●●○</small></button>
    <button id="btnSkill" class="btn">✨ Skill<small>ตอบคำถามเพื่อใช้พลัง</small></button>
    <button id="btnSwitch" class="btn green">🔄 Switch<small>สลับมอนสเตอร์</small></button>
    <button id="btnDef" class="btn orange">🛡 Defend<small>ลดดาเมจ 50%</small></button>
  </div>
</section>

<section id="complete" class="screen"><div class="center" id="compBody"></div></section>
<section id="end" class="screen"><canvas id="endCv"></canvas><div class="center" id="endBody"></div></section>

</div>
<div class="overlay" id="overlay" hidden><div class="modal-card" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   CAN MONSTER BATTLE: THE ABILITY ARENA
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Save / State ---------- */
const KEY='canMonsterBattle_v1';
let memSave=null;
function freshState(){
  const mons={};['aqua','flamy','breezy','rocky','sparky','frosty'].forEach(id=>mons[id]={lv:1,exp:0});
  return{team:[],mons,unlocked:['aqua','flamy','breezy','rocky'],crystals:[false,false,false],cleared:[false,false,false],coins:0,score:0,sound:true,started:false,stats:{correct:0,wrong:0}};
}
let S=freshState();
function loadSave(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):memSave;}catch(e){return memSave;}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memSave=JSON.parse(JSON.stringify(S));}}
function mergeSave(sv){
  const f=freshState();if(!sv||typeof sv!=='object')return f;
  const o=Object.assign(f,sv);
  const fm=freshState().mons;Object.keys(fm).forEach(k=>{const m=(sv.mons||{})[k]||{};fm[k]={lv:clamp(+m.lv||1,1,5),exp:Math.max(0,+m.exp||0)};});
  o.mons=fm;
  o.stats=Object.assign({correct:0,wrong:0},sv.stats||{});
  ['aqua','flamy','breezy','rocky'].forEach(id=>{if(!o.unlocked.includes(id))o.unlocked.push(id);});
  if(!Array.isArray(o.team))o.team=[];
  o.team=o.team.filter(id=>o.unlocked.includes(id)).slice(0,3);
  return o;
}
const hasGame=()=>S.started&&S.team.length===3;

/* ---------- Audio (Web Audio synth) ---------- */
let AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,d,type,vol,delay,slide){
  if(!S.sound)return;const a=audio();if(!a)return;
  try{
    const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
const SFX={
  click:()=>tone(660,.08,'square',.07),
  hit:()=>{tone(200,.2,'sawtooth',.14,0,-120);tone(90,.2,'square',.1,.02)},
  crit:()=>{tone(300,.25,'sawtooth',.16,0,-200);tone(900,.15,'square',.1,.05)},
  skill:()=>{tone(300,.4,'triangle',.16,0,700);tone(600,.4,'sine',.1,.1,500)},
  defend:()=>{tone(320,.12,'square',.09);tone(480,.18,'square',.09,.1)},
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08)),
  bad:()=>{tone(240,.25,'sawtooth',.11,0,-90);tone(170,.32,'sawtooth',.11,.16,-70)},
  win:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.12)),
  lvl:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.09,i*.09)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.13,i*.2))
};

/* ---------- Data ---------- */
const ORDER=['aqua','flamy','breezy','rocky','sparky','frosty'];
const MON={
  aqua:{name:'Aqua',type:'Water Monster',el:'Water',color:'#3aa8e8',hp:100,skill:'Water Splash',can:'swim',cant:'fly',unlock:null,th:'มอนสเตอร์น้ำใจดี ว่ายน้ำเก่งมาก'},
  flamy:{name:'Flamy',type:'Fire Monster',el:'Fire',color:'#ff6a3a',hp:90,skill:'Fire Blast',can:'breathe fire',cant:'swim',unlock:null,th:'มอนสเตอร์ไฟ ร้อนแรงและกล้าหาญ'},
  breezy:{name:'Breezy',type:'Wind Monster',el:'Wind',color:'#4fd8a8',hp:85,skill:'Sky Attack',can:'fly',cant:'swim',unlock:null,th:'มอนสเตอร์ลม บินโฉบไปมาได้อย่างอิสระ'},
  rocky:{name:'Rocky',type:'Earth Monster',el:'Earth',color:'#9a6a3a',hp:120,skill:'Rock Smash',can:'break rocks',cant:'fly',unlock:null,th:'มอนสเตอร์ดิน ตัวใหญ่และแข็งแกร่งที่สุด'},
  sparky:{name:'Sparky',type:'Electric Monster',el:'Electric',color:'#ffd93a',hp:95,skill:'Thunder Shock',can:'generate electricity',cant:'swim',unlock:'ชนะ Arena 1 เพื่อปลดล็อก',th:'มอนสเตอร์สายฟ้า ไวและซุกซน'},
  frosty:{name:'Frosty',type:'Ice Monster',el:'Ice',color:'#9fe3ff',hp:100,skill:'Ice Freeze',can:'freeze water',cant:'breathe fire',unlock:'ชนะ Arena 2 เพื่อปลดล็อก',th:'มอนสเตอร์น้ำแข็ง เย็นสบายแต่ใจอบอุ่น'}
};
const EL={Water:'#3aa8e8',Fire:'#ff6a3a',Wind:'#4fd8a8',Earth:'#a0703c',Electric:'#ffd93a',Ice:'#9fe3ff'};

/* ============================================================
   DRAWING
   ============================================================ */
function ell(c,x,y,rx,ry,f,s,lw){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);if(f){c.fillStyle=f;c.fill();}if(s){c.strokeStyle=s;c.lineWidth=lw||2;c.stroke();}}
function grad(c,x,y,r,a,b){const g=c.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r*1.25);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function lgrad(c,y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function poly(c,pts,f,s){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(f){c.fillStyle=f;c.fill();}if(s){c.strokeStyle=s;c.lineWidth=2;c.stroke();}}
function rr(c,x,y,w,h,r,f,s){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(f){c.fillStyle=f;c.fill();}if(s){c.strokeStyle=s;c.lineWidth=3;c.stroke();}}
function flame(c,x,y,w,h,a,b){c.beginPath();c.moveTo(x-w,y);c.quadraticCurveTo(x-w,y-h*.5,x,y-h);c.quadraticCurveTo(x+w,y-h*.5,x+w,y);c.closePath();c.fillStyle=lgrad(c,y,y-h,a,b);c.fill();}
/* ===== Monster graphics v2 (drawing only) ===== */
function limb(c,x1,y1,x2,y2,w,col,out){c.save();c.lineCap='round';c.strokeStyle=out;c.lineWidth=w+5;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore();}
function blob(c,fn,fill,out,lw){c.beginPath();fn(c);c.closePath();c.fillStyle=fill;c.fill();if(out){c.strokeStyle=out;c.lineWidth=lw||3;c.lineJoin='round';c.stroke();}}
function armAng(m,t,s){
  const sw=Math.sin(t*2.4+(s>0?0:1.6))*.12;
  if(m==='attack')return s>0?-.15:2.5;
  if(m==='hurt')return -Math.PI/2+s*1.0+Math.sin(t*30)*.12;
  if(m==='win')return -Math.PI/2+s*.5+Math.sin(t*10+s)*.35;
  if(m==='faint')return Math.PI/2-s*.3;
  return Math.PI/2-s*.55+sw;
}
function arm(c,t,m,x,y,len,w,col,out,s,hand){
  const a=armAng(m,t,s),hx=x+Math.cos(a)*len,hy=y+Math.sin(a)*len;
  limb(c,x,y,hx,hy,w,col,out);ell(c,hx,hy,w*.78,w*.72,hand||col,out,2.4);return [hx,hy];
}
function leg(c,t,m,x,y,len,w,col,out,s){
  const lift=m==='win'?Math.max(0,Math.sin(t*9+(s>0?0:2)))*9:0,sp=m==='attack'?s*7:(m==='hurt'?-s*3:0);
  const fx=x+s*3+sp,fy=-lift-w*.45;
  limb(c,x,y,fx,fy,w,col,out);ell(c,fx+s*3,fy+w*.1,w*.95,w*.45,col,out,2.6);
}
function zig(c,x,y,dx,dy,n,amp,seed){c.beginPath();c.moveTo(x,y);for(let i=1;i<=n;i++)c.lineTo(x+dx*i/n+Math.sin(seed*13+i*7.1)*amp,y+dy*i/n+Math.cos(seed*9+i*5.3)*amp);c.stroke();}

function face(c,t,mood,x,y,gap,r,mouthY,nomouth){
  const blink=(t%4)>3.88,K='#1d1533';
  [-1,1].forEach(s=>{
    const ex=x+s*gap;c.lineCap='round';c.strokeStyle=K;c.lineWidth=3;
    if(mood==='faint'){c.beginPath();c.moveTo(ex-r*.6,y-r*.6);c.lineTo(ex+r*.6,y+r*.6);c.moveTo(ex+r*.6,y-r*.6);c.lineTo(ex-r*.6,y+r*.6);c.stroke();}
    else if(mood==='win'){c.beginPath();c.arc(ex,y+r*.35,r*.75,Math.PI*1.1,Math.PI*1.9);c.stroke();}
    else if(mood==='hurt'){c.beginPath();c.moveTo(ex-s*r*.8,y-r*.7);c.lineTo(ex+s*r*.5,y);c.lineTo(ex-s*r*.8,y+r*.7);c.stroke();}
    else if(blink){c.beginPath();c.moveTo(ex-r*.8,y);c.lineTo(ex+r*.8,y);c.stroke();}
    else{
      const lk=mood==='attack'?1.5:0;
      ell(c,ex,y,r,r*1.18,'#fff',K,2);
      ell(c,ex+lk+Math.sin(t*1.3)*.8,y+1,r*.68,r*.86,K);
      ell(c,ex+lk+r*.22,y-r*.3,r*.26,r*.3,'#fff');ell(c,ex+lk-r*.25,y+r*.32,r*.12,r*.12,'rgba(255,255,255,.8)');
    }
  });
  c.lineCap='butt';
  if(mood==='attack'&&!blink){c.strokeStyle=K;c.lineWidth=4;c.lineCap='round';[-1,1].forEach(s=>{c.beginPath();c.moveTo(x+s*gap+s*r*1.2,y-r*1.7);c.lineTo(x+s*gap-s*r*.9,y-r*1.15);c.stroke();});c.lineCap='butt';}
  if(nomouth)return;
  const my=mouthY;
  if(mood==='attack'){ell(c,x,my+3,7,8,'#6b1424',K,2.5);ell(c,x,my+7,4.5,3,'#ff7a90');}
  else if(mood==='win'){c.beginPath();c.moveTo(x-10,my-2);c.quadraticCurveTo(x,my+14,x+10,my-2);c.closePath();c.fillStyle='#6b1424';c.fill();c.strokeStyle=K;c.lineWidth=2.5;c.stroke();ell(c,x,my+6,5,3,'#ff7a90');}
  else if(mood==='hurt'||mood==='faint'){c.strokeStyle=K;c.lineWidth=3;c.beginPath();c.moveTo(x-8,my+4);for(let i=1;i<=4;i++)c.lineTo(x-8+i*4,my+(i%2?-1:4));c.stroke();}
  else{c.strokeStyle=K;c.lineWidth=3;c.lineCap='round';c.beginPath();c.arc(x,my-4,7,.2*Math.PI,.8*Math.PI);c.stroke();c.lineCap='butt';}
}
function cheeks(c,x,y,d){ell(c,x-d,y,6,4,'rgba(255,110,140,.55)');ell(c,x+d,y,6,4,'rgba(255,110,140,.55)');}

function drawAqua(c,t,m){

  blob(c,k=>{k.moveTo(0,0);k.bezierCurveTo(-26,10,-60,2,-66,-34);k.bezierCurveTo(-46,-26,-30,-30,-12,-16);},lgrad(c,-34,8,'#a8ecff','#2d95dd'),O,3);
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.beginPath();c.moveTo(-8,-6);c.quadraticCurveTo(-36,-8,-56,-28);c.stroke();
  c.restore();
  leg(c,t,m,-15,-16,14,13,'#3fa9ea',O,-1);leg(c,t,m,15,-16,14,13,'#3fa9ea',O,1);
  [-1,1].forEach(s=>{for(let i=0;i<3;i++){
    const ang=-.1-i*.42+Math.sin(t*5+i+s)*.1;c.save();c.translate(s*36,-70);c.rotate(s>0?ang:Math.PI-ang);
    blob(c,k=>{k.ellipse(20,0,22,7,0,0,7);},'#ff9ccb','#b84583',2.2);ell(c,40,0,5,5,'#ffd1e6','#b84583',2);c.restore();}});
  blob(c,k=>{k.moveTo(0,-124+b*2);k.bezierCurveTo(10,-98,48,-76,48,-46);k.bezierCurveTo(48,-14,26,-4,0,-4);k.bezierCurveTo(-26,-4,-48,-14,-48,-46);k.bezierCurveTo(-48,-76,-10,-98,0,-124+b*2);},grad(c,0,-54,54,'#b9efff','#2a8ad4'),O,3.5);
  ell(c,0,-26,26,18,'rgba(236,251,255,.9)');

function drawMon(c,id,x,y,s,t,flip,mood,ex){
  ex=ex||{};const al=ex.alpha===undefined?1:ex.alpha;
  c.save();c.translate(x,y);
  c.globalAlpha=al*.25;ell(c,0,2,44*s,10*s,'#000');c.globalAlpha=al;
  if(ex.flash)c.filter='brightness(2.2) saturate(.6)';
  if(ex.rot)c.rotate(ex.rot);
  c.scale(flip?-s:s,s*(1+Math.sin(t*3)*.02));
  if(mood==='attack')c.rotate(.14);else if(mood==='hurt'){c.rotate(-.16);c.scale(1.08,.92);}else if(mood==='win')c.scale(1,1+Math.sin(t*9)*.04);
  DRAW[id](c,t,mood||'idle');
  c.restore();
}
function thumb(cv,id,locked){
  const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
  if(locked){
    const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');
    drawMon(tc,id,W/2,H-12,.85,1.2,false,'idle');tc.globalCompositeOperation='source-in';tc.fillStyle='#2a2a45';tc.fillRect(0,0,W,H);c.drawImage(tmp,0,0);
  }else drawMon(c,id,W/2,H-12,.85,1.2,false,'idle');
}

/* ---------- Team select & collection ---------- */
function isLocked(id){return !S.unlocked.includes(id);}
function cardHTML(id,locked){
  const m=MON[id];
  return '<div class="mcard'+(locked?' locked':'')+'" data-id="'+id+'"><canvas width="132" height="136"></canvas>'+(locked?'<div class="lock">🔒 Locked</div><b>? ? ?</b><small>ยังไม่ปลดล็อก</small>':'<b>'+m.name+'</b><small>'+m.el+' • Lv.'+S.mons[id].lv+'</small>')+'</div>';
}
function detailHTML(id){
  const m=MON[id];
  if(isLocked(id))return '<h3>? ? ?</h3><div class="cc" style="background:#eceefa;color:#555">🔒 Locked</div><p>'+m.unlock+'</p>';
  const lv=S.mons[id].lv;
  return '<h3>'+m.name+' <span class="chip" style="background:'+m.color+';color:#222">'+m.el+'</span></h3><p style="margin:4px 0 8px;color:#555">'+m.th+'</p>'+
  '<div><b>HP:</b> '+hpOf(id,lv)+' &nbsp; <b>Level:</b> '+lv+'</div>'+
  '<div><b>Skill:</b> '+m.skill+'</div><div style="font-size:13px;color:#666;margin-bottom:6px">โจมตีปกติ 10–15 • สกิล 20–30</div>'+
  '<div class="cc can">✅ '+m.name+' can '+m.can+'.</div><div class="cc cant">❌ '+m.name+" can't "+m.cant+'.</div>';
}
function bindCards(grid,onClick){
  $$(grid+' .mcard').forEach(el=>{const id=el.dataset.id;thumb(el.querySelector('canvas'),id,isLocked(id));el.onclick=()=>onClick(id);});
}
function setFocus(id,detSel,gridSel){
  focusId=id;prevStart=performance.now();$(detSel).innerHTML=detailHTML(id);
  $$(gridSel+' .mcard').forEach(e=>e.classList.toggle('focus',e.dataset.id===id));
}
function renderTeam(){
  $('#teamGrid').innerHTML=ORDER.map(id=>cardHTML(id,isLocked(id))).join('');
  bindCards('#teamGrid',id=>{
    SFX.click();setFocus(id,'#detT','#teamGrid');
    if(isLocked(id)){toast('มอนสเตอร์ตัวนี้ยังล็อกอยู่: '+MON[id].unlock);return;}
    const i=teamSel.indexOf(id);
    if(i>=0)teamSel.splice(i,1);
    else if(teamSel.length>=3){toast('ทีมเต็ม 3 ตัวแล้ว กดตัวที่เลือกไว้เพื่อเอาออกก่อน');return;}
    else teamSel.push(id);
    refreshTeam();
  });
  refreshTeam();
  setFocus(teamSel[0]||'aqua','#detT','#teamGrid');
}
function refreshTeam(){
  $$('#teamGrid .mcard').forEach(e=>e.classList.toggle('sel',teamSel.includes(e.dataset.id)));
  $('#teamSlots').innerHTML=[0,1,2].map(i=>'<div class="slot'+(teamSel[i]?' on':'')+'">'+(teamSel[i]?MON[teamSel[i]].name:'ช่อง '+(i+1))+'</div>').join('');
  $('#btnStart').disabled=teamSel.length!==3;
  $('#btnStart').textContent=teamSel.length===3?'Start Battle ▶':'เลือกอีก '+(3-teamSel.length)+' ตัว';
}
function openTeam(){teamSel=S.team.filter(id=>S.unlocked.includes(id)).slice();renderTeam();show('team');}
function renderCollection(){
  $('#collGrid').innerHTML=ORDER.map(id=>cardHTML(id,isLocked(id))).join('');
  bindCards('#collGrid',id=>{SFX.click();setFocus(id,'#detC','#collGrid');});
  setFocus('aqua','#detC','#collGrid');
}

/* ---------- Arena select ---------- */
const arenaUnlocked=i=>i===0||S.cleared[i-1];
function renderArenas(){
  $('#hudCoins').textContent='🪙 '+S.coins+'  ⭐ '+S.score;
  $('#hudCrystals').innerHTML=S.crystals.map(v=>'<span class="'+(v?'on':'')+'">💎</span>').join('');
  $('#arenaGrid').innerHTML=ARENAS.map((a,i)=>{
    const ok=arenaUnlocked(i);
    return '<div class="acard'+(ok?'':' lock')+'"><canvas width="320" height="176" data-bg="'+a.bg+'"></canvas>'+(ok?'':'<div class="badge">🔒</div>')+
    '<div class="body"><h3>Arena '+(i+1)+': '+a.name+'</h3><div style="color:#555;font-size:14px;margin:4px 0">'+a.th+'</div>'+
    '<div style="font-size:13px">ศัตรู '+a.enemies.length+' ตัว • รางวัล: '+a.reward+'</div>'+
    '<div style="margin:8px 0;font-weight:700">'+(S.cleared[i]?'✅ ผ่านแล้ว':ok?'พร้อมลุย!':'ชนะสนามก่อนหน้าเพื่อปลดล็อก')+'</div>'+
    '<button class="btn '+(S.cleared[i]?'orange':'green')+'" data-ar="'+i+'" '+(ok?'':'disabled')+'>'+(S.cleared[i]?'เล่นซ้ำ':'เข้าสู่สนาม')+' ▶</button></div></div>';
  }).join('');
  $$('#arenaGrid canvas').forEach(cv=>{const c=cv.getContext('2d');c.save();c.scale(.4,.4);drawBG(c,cv.dataset.bg,1,800,440);c.restore();});
  $$('#arenaGrid button[data-ar]').forEach(b=>b.onclick=()=>{SFX.click();startBattle(+b.dataset.ar);});
}
function openArenas(){renderArenas();show('arenas');}

/* ============================================================
   BATTLE
   ============================================================ */
const ABORT={};
async function wait(ms){const b=B;await sleep(ms);if(B!==b||!b||b.dead)throw ABORT;}
function run(fn){return async()=>{try{await fn();}catch(e){if(e!==ABORT)console.error(e);}};}
const curM=()=>B.team[B.active];
const aliveCount=()=>B.team.filter(m=>m.hp>0).length;
const aliveOthers=()=>B.team.map((m,i)=>i).filter(i=>i!==B.active&&B.team[i].hp>0);
const P_POS={x:205,y:388},E_POS={x:600,y:382};

function startBattle(ar){
  if(S.team.length!==3){openTeam();return;}
  BOSS_P2=false;
  B={ar,dead:false,team:S.team.map(id=>{const lv=S.mons[id].lv,mx=hpOf(id,lv);return{id,lv,maxHp:mx,hp:mx,dispHp:mx,cd:0};}),
    active:0,pDef:false,ei:0,enemy:null,busy:true,over:false,used:new Set(),correct:0,wrong:0,turn:0,charge:3,
    log:[],fx:[],parts:[],texts:[],shake:0,pv:{anim:null},ev:{anim:null},phase2:false,last:0};
  $('#log').innerHTML='';$('#bTitle').textContent='Arena '+(ar+1)+': '+ARENAS[ar].name;
  $('#btnBSound').textContent=S.sound?'🔊':'🔇';
  spawnEnemy(0);show('battle');updateCmds();
  logLine('ยินดีต้อนรับสู่ '+ARENAS[ar].name+'! เริ่มต่อสู้เลย','y');
  run(async()=>{banner('BATTLE START!');await wait(1300);B.busy=false;updateCmds();})();
}
function spawnEnemy(i){
  const key=ARENAS[B.ar].enemies[i],d=ENEMY[key];
  B.enemy={key,name:d.name,hp:d.hp,maxHp:d.hp,dispHp:d.hp,atk:d.atk,sp:d.sp,weak:d.weak,scale:d.scale,guard:false,turns:0,canDefend:ARENAS[B.ar].defend};
  B.ev.anim={type:'in',start:performance.now(),dur:700};B.pDef=false;
  $('#bProg').textContent='ศัตรู '+(i+1)+' / '+ARENAS[B.ar].enemies.length;
  if(i>0)logLine('ศัตรูตัวใหม่ปรากฏ: '+d.name+'!','y');
}
function logLine(msg,cls){
  if(!B)return;B.log.push([msg,cls]);if(B.log.length>5)B.log.shift();
  $('#log').innerHTML=B.log.map(l=>'<div'+(l[1]?' class="'+l[1]+'"':'')+'>'+l[0]+'</div>').join('');
}
function banner(txt){const b=$('#banner');b.textContent=txt;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function updateCmds(){
  if(!B)return;const dis=B.busy||B.over,m=curM();
  $('#btnAtk').disabled=dis||B.charge<=0;
  $('#btnAtk').innerHTML='⚔ Attack<small>'+(B.charge>0?'พลังโจมตี '+'●'.repeat(B.charge)+'○'.repeat(4-B.charge):'พลังหมด! ตอบคำถามเพื่อชาร์จ')+'</small>';
  $('#btnSkill').disabled=dis||(m.cd>0&&B.charge>0);
  $('#btnSkill').innerHTML='✨ '+(m.cd>0&&B.charge<=0?'ชาร์จพลัง':MON[m.id].skill)+'<small>'+(m.cd>0?(B.charge>0?'คูลดาวน์ อีก '+m.cd+' เทิร์น':'ตอบถูกเพื่อชาร์จ +2'):'ตอบคำถามเพื่อใช้พลัง')+'</small>';
  $('#btnSwitch').disabled=dis||aliveOthers().length===0;
  $('#btnDef').disabled=dis;
}
function spawnP(x,y,col,n,o){
  o=o||{};for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(o.spd||200)*(.3+Math.random());
    B.parts.push({x:x+(o.sx?(Math.random()-.5)*o.sx:0),y:y+(o.sy?(Math.random()-.5)*o.sy:0),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+(o.vy||0),g:o.g===undefined?400:o.g,life:o.life||.8,max:o.life||.8,size:o.size||5,col,sq:!!o.sq});}
}
function pushText(x,y,txt,col,size){B.texts.push({x,y,txt,col,size:size||26,life:1.1,max:1.1});}
function skillBurst(el,x,y){
  const col=EL[el];spawnP(x,y,col,30,{spd:260});
  if(el==='Fire')spawnP(x,y+20,'#ffd24a',30,{spd:120,g:-300,life:1,size:7});
  if(el==='Water')spawnP(x,y-170,'#bfe9ff',34,{spd:40,g:700,life:1,size:5,sx:120});
  if(el==='Wind')B.fx.push({start:performance.now(),dur:600,draw:(c,p)=>{c.strokeStyle='rgba(180,255,230,'+(1-p)+')';c.lineWidth=5;for(let i=0;i<3;i++){c.beginPath();c.arc(x,y,30+p*90+i*18,i,i+3.5);c.stroke();}}});
  if(el==='Earth')spawnP(x,y-190,'#8a5a30',24,{spd:30,g:900,life:1,size:9,sq:true,sx:140});
  if(el==='Ice')spawnP(x,y,'#e4faff',28,{spd:300,g:200,life:1,size:6,sq:true});
  if(el==='Electric')B.fx.push({start:performance.now(),dur:450,draw:(c,p)=>{c.strokeStyle='rgba(255,240,100,'+(1-p)+')';c.lineWidth=5;c.beginPath();let px=x,py=0;c.moveTo(px,py);while(py<y){py+=28;px=x+(Math.random()-.5)*50;c.lineTo(px,py);}c.stroke();}});
  B.fx.push({start:performance.now(),dur:500,draw:(c,p)=>{c.strokeStyle=col;c.globalAlpha=1-p;c.lineWidth=6;c.beginPath();c.arc(x,y,20+p*110,0,7);c.stroke();c.globalAlpha=1;}});
  skillGround(el,x);
}
function shieldFx(x,y,col){B.fx.push({start:performance.now(),dur:700,draw:(c,p)=>{c.globalAlpha=Math.sin(p*Math.PI)*.7;ell(c,x,y,80,90,'rgba(120,200,255,.25)',col,5);c.globalAlpha=1;}});}

/* ----- player actions ----- */
function canAct(){return B&&!B.busy&&!B.over;}
function endTurnCd(used){B.team.forEach(m=>{if(m!==used&&m.cd>0)m.cd--;});if(used)used.cd=2;}

async function playerStrike(m,base,isSkill){
  const e=B.enemy,md=MON[m.id];let dmg=base;
  const crit=Math.random()<.1;if(crit)dmg=Math.round(dmg*1.5);
  const eff=e.weak===md.el;if(eff)dmg=Math.round(dmg*1.3);
  let guarded=false;if(e.guard){dmg=Math.max(1,Math.round(dmg*.5));e.guard=false;guarded=true;}
  B.pv.anim={type:'attack',start:performance.now(),dur:isSkill?750:520};
  if(isSkill){SFX.skill();chargeFx(P_POS.x+30,P_POS.y-90,EL[md.el]);projectile(P_POS.x+60,P_POS.y-90,E_POS.x,E_POS.y-90,EL[md.el],420,md.el);}
  await wait(isSkill?430:270);
  e.hp=clamp(e.hp-dmg,0,e.maxHp);B.ev.anim={type:'hurt',start:performance.now(),dur:500};
  crit?SFX.crit():SFX.hit();B.shake=isSkill?.35:.15;
  spawnP(E_POS.x,E_POS.y-80,crit?'#fff':EL[md.el],14,{spd:220});hitFx(E_POS.x,E_POS.y-85,crit?'#fff':EL[md.el],isSkill||crit);
  if(isSkill)skillBurst(md.el,E_POS.x,E_POS.y-80);
  pushText(E_POS.x,E_POS.y-130,'-'+dmg,crit?'#ffe066':'#fff',crit?36:28);
  let msg=isSkill?md.name+' ใช้ '+md.skill+'! ศัตรูเสีย '+dmg+' HP':md.name+' โจมตี! ศัตรูเสีย '+dmg+' HP';
  if(crit)msg+=' ★ Critical!';if(eff)msg+=' 🔥 ถูกจุดอ่อน!';if(guarded)msg+=' (ศัตรูป้องกันอยู่)';
  logLine(msg,isSkill?'g':'');
  await wait(550);
}
async function afterPlayerAction(used){
  B.turn++;endTurnCd(used);updateCmds();
  const e=B.enemy;
  if(e.hp<=0){await enemyDown();return;}
  if(e.key==='boss'&&!B.phase2&&e.hp<=e.maxHp/2)await enterPhase2();
  await enemyTurn();
}
async function doAttack(){
  if(!canAct())return;
  if(B.charge<=0){toast('พลังโจมตีหมด! กด Skill แล้วตอบคำถามเพื่อชาร์จ');return;}
  B.charge--;B.busy=true;updateCmds();SFX.click();
  const m=curM();await playerStrike(m,rand(10,15)+(m.lv-1)*2,false);await afterPlayerAction(null);
}
async function doSkill(){
  if(!canAct())return;const m=curM();
  if(m.cd>0&&B.charge>0){toast('ท่าพิเศษกำลังคูลดาวน์ อีก '+m.cd+' เทิร์น');return;}
  const chargeOnly=m.cd>0;
  B.busy=true;updateCmds();SFX.click();
  const ok=await askQuestion(m);
  if(ok===null){B.busy=false;updateCmds();return;}
  if(ok){B.correct++;B.charge=Math.min(4,B.charge+2);
    if(chargeOnly){logLine('ตอบถูก! ชาร์จพลังโจมตี +2 ⚡ +3 🪙','g');SFX.skill();await wait(600);await afterPlayerAction(null);}
    else{logLine('ตอบถูก! Ability Unlocked! +3 🪙 ชาร์จพลังโจมตี +2 ⚡','g');await wait(250);await playerStrike(m,rand(20,30)+(m.lv-1)*3,true);await afterPlayerAction(m);}}
  else{B.wrong++;logLine('ตอบยังไม่ถูก ท่าพิเศษล้มเหลว แต่ไม่เป็นไร! ลองใหม่ได้','b');await wait(500);await afterPlayerAction(null);}
}
async function doDefend(){
  if(!canAct())return;B.busy=true;updateCmds();SFX.click();
  B.pDef=true;SFX.defend();shieldFx(P_POS.x,P_POS.y-80,'#7fd0ff');
  logLine(MON[curM().id].name+' ตั้งท่าป้องกัน! ดาเมจครั้งต่อไปลดลง 50%','y');
  await wait(650);await afterPlayerAction(null);
}
async function doSwitch(){
  if(!canAct())return;
  if(aliveOthers().length===0){toast('ไม่มีมอนสเตอร์ตัวอื่นที่ยังสู้ได้');return;}
  B.busy=true;updateCmds();SFX.click();
  const idx=await pickMon(true);
  if(idx===null){B.busy=false;updateCmds();return;}
  await switchTo(idx);B.pDef=false;await afterPlayerAction(null);
}
async function switchTo(idx){
  B.active=idx;B.pv.anim={type:'in',start:performance.now(),dur:600};
  SFX.skill();spawnP(P_POS.x,P_POS.y-70,MON[B.team[idx].id].color,24,{spd:200});
  logLine('สลับเป็น '+MON[B.team[idx].id].name+'! Great choice!','g');updateCmds();await wait(700);
}
function pickMon(cancel){
  return new Promise(res=>{
    openModal('<h3>เลือกมอนสเตอร์</h3><div id="pickList"></div>'+(cancel?'<div class="row" style="margin-top:8px"><button class="btn gray" id="pkCancel">ยกเลิก</button></div>':''));
    $('#pickList').innerHTML=B.team.map((m,i)=>{
      const dis=m.hp<=0||i===B.active;
      return '<button class="mini" data-i="'+i+'" '+(dis?'disabled':'')+'><canvas width="64" height="70"></canvas><div style="flex:1"><b>'+MON[m.id].name+'</b> Lv.'+m.lv+' <span class="chip" style="background:'+MON[m.id].color+';color:#222">'+MON[m.id].el+'</span><div style="font-size:12px;color:#555">'+(m.hp<=0?'สลบแล้ว':i===B.active?'กำลังต่อสู้':'Skill: '+MON[m.id].skill+(m.cd>0?' (CD '+m.cd+')':''))+'</div><div class="bar"><i style="width:'+(m.hp/m.maxHp*100)+'%"></i></div><div style="font-size:12px">HP '+m.hp+'/'+m.maxHp+'</div></div></button>';
    }).join('');
    $$('#pickList .mini').forEach(b=>{
      const i=+b.dataset.i,cv=b.querySelector('canvas'),c=cv.getContext('2d');drawMon(c,B.team[i].id,32,66,.5,1.2,false,B.team[i].hp<=0?'faint':'idle');
      b.onclick=()=>{SFX.click();closeModal();res(i);};
    });
    if(cancel)$('#pkCancel').onclick=()=>{SFX.click();closeModal();res(null);};
  });
}

/* ----- question popup ----- */
function pickQuestion(m){
  const lvs=B.phase2?[3]:(B.ar===0?[1]:B.ar===1?[2]:[2,3]);
  const pool=QS.filter(q=>lvs.includes(q.lv));
  let un=pool.filter(q=>!B.used.has(q.id));
  if(!un.length){pool.forEach(q=>B.used.delete(q.id));un=pool.slice();}
  const sp=un.filter(q=>q.m===m.id);
  if(B.ar===2&&!B.phase2){const h=(sp.length?sp:un).filter(q=>q.lv===3);if(h.length){const q=h[rand(0,h.length-1)];B.used.add(q.id);return q;}}
  const list=sp.length?sp:un,q=list[rand(0,list.length-1)];B.used.add(q.id);return q;
}
function askQuestion(m){
  return new Promise(res=>{
    const q=pickQuestion(m),md=MON[m.id],opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a}))),L=['A','B','C','D'];
    const lvName=['','Easy','Medium','Hard'][q.lv];let locked=false;
    openModal('<div class="q-top"><span><span class="chip" style="background:'+md.color+';color:#222">'+md.name+'</span> ต้องการใช้ <b>'+md.skill+'</b>!</span><span class="chip" style="background:'+['','#2fbf71','#ff9f1c','#e03550'][q.lv]+'">'+lvName+'</span></div>'+
      '<div style="color:#555;font-size:14px">ตอบคำถามให้ถูกเพื่อปลดล็อกพลังพิเศษ</div><div class="q-text">'+q.q+'</div>'+
      '<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'"><b>'+L[i]+'.</b> '+o.t+'</button>').join('')+'</div>'+
      '<div class="fb" id="qFb" hidden></div><div class="row" style="margin-top:14px"><button class="btn gray" id="qCancel">ยกเลิก (ไม่เสียเทิร์น)</button><button class="btn green" id="qNext" hidden>ต่อไป ▶</button></div>');
    let result=null;
    $$('#modalBox .opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const i=+b.dataset.i,ok=opts[i].ok;result=ok;
      $$('#modalBox .opt').forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('right');});
      if(!ok)b.classList.add('wrong');
      const fb=$('#qFb');fb.hidden=false;fb.className='fb '+(ok?'ok':'no');
      const right=opts.find(o=>o.ok).t;
      fb.innerHTML=ok?'<b>Excellent! Your monster used its ability! ✨</b><br>'+q.ex:'<b>Try again! You can do it! 💪</b><br>คำตอบที่ถูกคือ: <b>'+right+'</b><br>'+q.ex;
      ok?SFX.good():SFX.bad();
      $('#qCancel').hidden=true;$('#qNext').hidden=false;
      if(ok){S.coins+=3;S.score+=10;persist();}
    });
    $('#qCancel').onclick=()=>{if(locked)return;SFX.click();B.used.delete(q.id);closeModal();res(null);};
    $('#qNext').onclick=()=>{SFX.click();closeModal();res(result);};
  });
}

/* ----- enemy ----- */
async function enterPhase2(){
  B.phase2=true;BOSS_P2=true;B.shake=.8;SFX.crit();banner('PHASE 2!');
  logLine('Dark Grammar Monster โกรธแล้ว! คำถามยากขึ้นและโจมตีแรงขึ้น!','b');
  spawnP(E_POS.x,E_POS.y-100,'#ff3355',40,{spd:300});await wait(1300);
}
async function enemyTurn(){
  const e=B.enemy;await wait(350);e.turns++;
  let act='attack';
  if(e.key==='boss'){
    if(e.turns%(B.phase2?2:3)===0)act='special';
    else if(!e.guard&&e.hp<e.maxHp*.8&&Math.random()<.25)act='defend';
  }else if(e.canDefend&&!e.guard&&e.hp<e.maxHp*.6&&Math.random()<.35)act='defend';
  if(act==='defend'){
    e.guard=true;SFX.defend();shieldFx(E_POS.x,E_POS.y-90,'#ffb347');
    logLine(e.name+' ป้องกันตัว! การโจมตีถัดไปจะอ่อนลง','y');await wait(800);
    B.busy=false;updateCmds();return;
  }
  if(act==='special'){banner(e.key==='boss'?'Grammar Storm!':'Special!');await wait(700);}
  const m=curM();
  let dmg=act==='special'?rand(e.sp[0],e.sp[1]):rand(e.atk[0],e.atk[1]);
  if(B.phase2)dmg+=3;
  const crit=Math.random()<.08;if(crit)dmg=Math.round(dmg*1.5);
  let defended=false;if(B.pDef){dmg=Math.max(1,Math.round(dmg*.5));B.pDef=false;defended=true;}
  B.ev.anim={type:'attack',start:performance.now(),dur:560};
  if(act==='special')projectile(E_POS.x-60,E_POS.y-100,P_POS.x,P_POS.y-90,'#b36bff',420);
  await wait(act==='special'?430:290);
  m.hp=clamp(m.hp-dmg,0,m.maxHp);B.pv.anim={type:'hurt',start:performance.now(),dur:500};
  crit?SFX.crit():SFX.hit();B.shake=act==='special'?.4:.18;
  spawnP(P_POS.x,P_POS.y-80,'#ff8a8a',14,{spd:220});hitFx(P_POS.x,P_POS.y-85,'#ff8a8a',act==='special');
  pushText(P_POS.x,P_POS.y-130,'-'+dmg,'#ff8a8a',28);
  logLine(e.name+(act==='special'?' ใช้ท่าพิเศษ! ':' โจมตี! ')+MON[m.id].name+' เสีย '+dmg+' HP'+(crit?' ★ Critical!':'')+(defended?' 🛡 ป้องกันได้!':''),'b');
  await wait(600);
  if(m.hp<=0){
    B.pv.anim={type:'faint',start:performance.now(),dur:700};
    logLine(MON[m.id].name+' หมดแรงแล้ว!','b');await wait(900);
    if(aliveCount()===0){await loseBattle();return;}
    banner('เลือกตัวต่อไป!');
    const idx=await pickMon(false);await switchTo(idx);
  }
  B.busy=false;updateCmds();
}
async function enemyDown(){
  const e=B.enemy;B.ev.anim={type:'faint',start:performance.now(),dur:800};
  SFX.win();spawnP(E_POS.x,E_POS.y-80,'#ffe066',30,{spd:260});
  logLine(e.name+' ถูกปราบแล้ว!','g');await wait(1100);
  B.ei++;
  if(B.ei>=ARENAS[B.ar].enemies.length){await winBattle();return;}
  spawnEnemy(B.ei);await wait(800);B.busy=false;updateCmds();
}

/* ----- win / lose ----- */
async function winBattle(){
  B.over=true;updateCmds();banner('VICTORY!');B.pv.anim={type:'win',start:performance.now(),dur:1e9};
  logLine('ชนะแล้ว! Congratulations, Monster Trainer!','g');await wait(2000);
  const ar=B.ar,first=!S.cleared[ar];
  const coins=20+ar*10+B.correct*3+(first?30:0),score=100*(ar+1)+B.correct*10,exp=30+ar*15;
  // coins from correct answers (3 each) and 10 score each were already paid in question popup
  S.coins+=20+ar*10+(first?30:0);S.score+=100*(ar+1);
  S.stats.correct+=B.correct;S.stats.wrong+=B.wrong;
  const ups=[];
  S.team.forEach(id=>{
    const ms=S.mons[id],from=ms.lv;ms.exp+=exp;
    while(ms.lv<5&&ms.exp>=need(ms.lv)){ms.exp-=need(ms.lv);ms.lv++;}
    if(ms.lv>=5)ms.exp=0;
    ups.push({id,from,to:ms.lv,exp:ms.exp,need:ms.lv>=5?1:need(ms.lv),max:ms.lv>=5});
  });
  let newMon=null;
  if(first){S.cleared[ar]=true;S.crystals[ar]=true;
    const u=ar===0?'sparky':ar===1?'frosty':null;if(u&&!S.unlocked.includes(u)){S.unlocked.push(u);newMon=u;}}
  persist();
  showComplete({ar,first,coins,score,exp,ups,newMon,correct:B.correct,wrong:B.wrong});
}
async function loseBattle(){
  B.over=true;updateCmds();SFX.lose();banner('GAME OVER');logLine('ทีมของคุณหมดแรงแล้ว แต่ไม่เป็นไร ลองใหม่ได้เสมอ!','b');
  S.stats.correct+=B.correct;S.stats.wrong+=B.wrong;persist();
  await wait(1800);
  const ar=B.ar;
  $('#endBody').innerHTML='<div class="big-title">Try again! You can do it!</div><div class="panel"><h3>ไม่เป็นไร! ทุกคนพลาดได้</h3><p>ตอบถูก '+B.correct+' ข้อ ตอบผิด '+B.wrong+' ข้อ ในรอบนี้</p><p>เคล็ดลับ: ดูช่อง "จุดอ่อน" ของศัตรู ใช้ Defend เมื่อ HP ต่ำ และสลับมอนสเตอร์ให้เหมาะสม</p><div class="row"><button class="btn green" id="eRetry">⚔ ลองอีกครั้ง</button><button class="btn orange" id="eTeam">🔄 เปลี่ยนทีม</button><button class="btn gray" id="eArena">เลือกสนาม</button></div></div>';
  endMode=null;show('end');
  $('#eRetry').onclick=()=>{SFX.click();startBattle(ar);};
  $('#eTeam').onclick=()=>{SFX.click();openTeam();};
  $('#eArena').onclick=()=>{SFX.click();openArenas();};
}
function showComplete(r){
  const A=ARENAS[r.ar];
  let h='<div class="big-title">Level Complete!</div><div class="panel"><h3>Arena '+(r.ar+1)+': '+A.name+'</h3>';
  if(r.first)h+='<div style="margin:10px 0"><span class="crystal">💎</span><div style="font-weight:800">Ability Crystal #'+(r.ar+1)+' ได้รับแล้ว!</div></div>';
  h+='<div class="rew"><span>🪙 +'+r.coins+' เหรียญ</span><span>⭐ +'+r.score+' คะแนน</span><span>EXP +'+r.exp+'</span></div><div style="font-size:14px;color:#555">ตอบถูก '+r.correct+' ข้อ • ตอบผิด '+r.wrong+' ข้อ (ตอบถูกได้โบนัส +3 🪙 +10 ⭐ ต่อข้อ)</div></div>';
  if(r.newMon)h+='<div class="panel"><h3>🎉 ปลดล็อกมอนสเตอร์ใหม่!</h3><canvas id="nmCv" width="132" height="136" style="background:#e6efff;border-radius:14px"></canvas><div><b>'+MON[r.newMon].name+'</b> — '+MON[r.newMon].skill+'</div></div>';
  h+='<div class="panel"><h3 style="margin-bottom:6px">ทีมของคุณแข็งแกร่งขึ้น!</h3>'+r.ups.map(u=>'<div class="mini" style="cursor:default"><canvas width="64" height="70" data-id="'+u.id+'"></canvas><div style="flex:1;text-align:left"><b>'+MON[u.id].name+'</b> Lv.'+u.to+' '+(u.to>u.from?'<span class="lvup">LEVEL UP! Lv.'+u.from+' → '+u.to+'</span>':'')+'<div class="bar xp"><i style="width:'+(u.max?100:u.exp/u.need*100)+'%"></i></div><div style="font-size:12px">'+(u.max?'MAX LEVEL':'EXP '+u.exp+' / '+u.need)+'</div></div></div>').join('')+'</div>';
  h+='<div class="row">';
  if(r.ar<2)h+='<button class="btn green" id="cNext">สนามต่อไป ▶</button>';else h+='<button class="btn green" id="cEnd">ดูฉากจบ ★</button>';
  h+='<button class="btn gray" id="cArena">เลือกสนาม</button></div>';
  $('#compBody').innerHTML=h;show('complete');
  $$('#compBody canvas[data-id]').forEach(cv=>drawMon(cv.getContext('2d'),cv.dataset.id,32,66,.5,1.2,false,'idle'));
  if(r.newMon)thumb($('#nmCv'),r.newMon,false);
  if(r.ups.some(u=>u.to>u.from))SFX.lvl();
  if($('#cNext'))$('#cNext').onclick=()=>{SFX.click();startBattle(r.ar+1);};
  if($('#cEnd'))$('#cEnd').onclick=()=>{SFX.click();showVictory();};
  $('#cArena').onclick=()=>{SFX.click();openArenas();};
}
let endMode=null,confetti=[];
function showVictory(){
  $('#endBody').innerHTML='<div class="big-title">🏆 Congratulations, Monster Trainer!</div><div class="panel"><h3>คุณกู้ Ability Crystal ครบทั้ง 3 ดวงแล้ว!</h3><div style="margin:10px 0"><span class="crystal">💎</span><span class="crystal" style="animation-delay:.3s">💎</span><span class="crystal" style="animation-delay:.6s">💎</span></div><p>Dark Grammar Monster พ่ายแพ้แล้ว ความสามารถของมอนสเตอร์กลับมาอีกครั้ง!</p><div class="rew"><span>🪙 '+S.coins+'</span><span>⭐ '+S.score+'</span><span>ตอบถูกรวม '+S.stats.correct+' ข้อ</span></div><p style="color:#555;font-size:14px">Your team is getting stronger! เล่นซ้ำเพื่อเก็บ EXP ให้ถึงเลเวล 5 ได้เลย</p><div class="row"><button class="btn green" id="vArena">เล่นซ้ำสนามต่าง ๆ</button><button class="btn gray" id="vMenu">เมนูหลัก</button></div></div>';
  const cv=$('#endCv');cv.width=innerWidth;cv.height=innerHeight;
  confetti=[];for(let i=0;i<140;i++)confetti.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,vy:60+Math.random()*120,vx:(Math.random()-.5)*60,c:['#ffd23a','#ff6a8a','#6ef0ff','#8f6bff','#4fd8a8'][i%5],s:5+Math.random()*7,r:Math.random()*6});
  endMode='win';show('end');SFX.win();
  $('#vArena').onclick=()=>{SFX.click();openArenas();};
  $('#vMenu').onclick=()=>{SFX.click();updateMenu();show('menu');};
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function animOf(v,now,dir){
  const o={dx:0,dy:0,mood:'idle',flash:false,alpha:1,rot:0},a=v.anim;if(!a)return o;
  const p=(now-a.start)/a.dur,q=clamp(p,0,1);
  if(a.type==='attack'){o.dx=Math.sin(q*Math.PI)*110*dir;o.mood='attack';if(p>=1)v.anim=null;}
  else if(a.type==='hurt'){o.dx=Math.sin(q*40)*(1-q)*10;o.flash=Math.floor(q*8)%2===0;o.mood='hurt';if(p>=1)v.anim=null;}
  else if(a.type==='win'){o.dy=-Math.abs(Math.sin(p*9))*36;o.mood='win';}
  else if(a.type==='faint'){o.alpha=1-q;o.rot=-dir*q*1.2;o.dy=q*20;o.mood='faint';}
  else if(a.type==='in'){const e=1-Math.pow(1-q,3);o.dx=-dir*260*(1-e);o.alpha=Math.min(1,q*3);if(p>=1)v.anim=null;}
  return o;
}
function panel(c,x,y,w,title,sub,hp,mx,extra){
  c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=10;c.shadowOffsetY=4;rr(c,x,y,w,76,14,'rgba(255,255,255,.94)');c.restore();
  c.textBaseline='top';c.fillStyle='#2b2b4a';c.font='bold 17px sans-serif';c.textAlign='left';c.fillText(title,x+12,y+8);
  c.font='13px sans-serif';c.fillStyle='#666';c.textAlign='right';c.fillText(sub,x+w-12,y+10);
  c.textAlign='left';rr(c,x+12,y+34,w-24,14,7,'#d9dbe8');
  const pct=clamp(hp/mx,0,1),bc=pct>.5?'#3ccf6b':pct>.25?'#ffc233':'#ff4d5e';
  if(pct>.001)rr(c,x+12,y+34,Math.max(14,(w-24)*pct),14,7,bc);
  c.fillStyle='#2b2b4a';c.font='bold 12px sans-serif';c.fillText('HP '+Math.ceil(hp)+' / '+mx,x+12,y+53);
  c.textAlign='right';c.font='12px sans-serif';c.fillStyle='#555';c.fillText(extra||'',x+w-12,y+53);c.textAlign='left';
}
function drawBattle(t,now){
  const c=$('#bcv').getContext('2d'),dt=Math.min(.05,B.last?(now-B.last)/1000:.016);B.last=now;
  c.save();
  if(B.shake>0){B.shake-=dt;c.translate((Math.random()-.5)*10,(Math.random()-.5)*10);}
  drawBG(c,ARENAS[B.ar].bg,t,800,440);
  B.team.forEach(m=>{m.dispHp+=(m.hp-m.dispHp)*Math.min(1,dt*6);if(Math.abs(m.hp-m.dispHp)<.3)m.dispHp=m.hp;});
  const e=B.enemy,pm=curM();
  if(e){e.dispHp+=(e.hp-e.dispHp)*Math.min(1,dt*6);if(Math.abs(e.hp-e.dispHp)<.3)e.dispHp=e.hp;
    const a=animOf(B.ev,now,-1);drawMon(c,e.key,E_POS.x+a.dx,E_POS.y+a.dy,e.scale,t,e.key!=='boss',a.mood,{alpha:a.alpha,flash:a.flash,rot:a.rot});
    if(e.guard&&e.hp>0){ell(c,E_POS.x,E_POS.y-90,82,92,'rgba(255,190,90,.18)','#ffb347',4);}}
  {const a=animOf(B.pv,now,1);drawMon(c,pm.id,P_POS.x+a.dx,P_POS.y+a.dy,1.35,t,false,a.mood,{alpha:a.alpha,flash:a.flash,rot:a.rot});
    if(B.pDef&&pm.hp>0){ell(c,P_POS.x,P_POS.y-85,82,92,'rgba(120,200,255,.2)','#7fd0ff',4);}}
  B.fx=B.fx.filter(f=>{const p=(now-f.start)/f.dur;if(p>=1)return false;f.draw(c,p);return true;});
  B.parts=B.parts.filter(p=>{p.life-=dt;if(p.life<=0)return false;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.98;c.globalAlpha=clamp(p.life/p.max,0,1);c.fillStyle=p.col;if(p.sq)c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);else{c.beginPath();c.arc(p.x,p.y,p.size*clamp(p.life/p.max,.3,1),0,7);c.fill();}c.globalAlpha=1;return true;});
  B.texts=B.texts.filter(x=>{x.life-=dt;if(x.life<=0)return false;x.y-=40*dt;c.globalAlpha=clamp(x.life/x.max*1.5,0,1);c.font='900 '+x.size+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=5;c.strokeStyle='#222';c.strokeText(x.txt,x.x,x.y);c.fillStyle=x.col;c.fillText(x.txt,x.x,x.y);c.globalAlpha=1;c.textAlign='left';return true;});
  {const vg=c.createRadialGradient(400,230,200,400,230,520);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,0,30,.32)');c.fillStyle=vg;c.fillRect(0,0,800,440);}
  // HUD
  panel(c,14,12,290,MON[pm.id].name,'Lv.'+pm.lv+' • '+MON[pm.id].el,pm.dispHp,pm.maxHp,pm.cd>0?'Skill CD '+pm.cd:'Skill พร้อม!');
  B.team.forEach((m,i)=>{const x=28+i*28;ell(c,x,106,10,10,m.hp>0?MON[m.id].color:'#888',i===B.active?'#fff':'rgba(0,0,0,.4)',i===B.active?4:2);if(m.hp<=0){c.fillStyle='#fff';c.font='bold 12px sans-serif';c.textAlign='center';c.fillText('×',x,106);c.textAlign='left';}});
  if(e){const ex=B.enemy.key==='boss'&&B.phase2?'PHASE 2':'จุดอ่อน: '+e.weak;
    panel(c,496,12,290,e.name,'Enemy',e.dispHp,e.maxHp,ex);
    if(e.guard){c.fillStyle='#ff9f1c';c.font='bold 13px sans-serif';c.textBaseline='top';c.fillText('🛡 กำลังป้องกัน',500,92);}}
  c.restore();
}
function drawTitle(t,now){
  const c=$('#titleCv').getContext('2d');
  c.fillStyle=lgrad(c,0,450,'#2a1a7a','#7a4fd0');c.fillRect(0,0,800,450);
  for(let i=0;i<40;i++){c.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+i));ell(c,(i*97)%800,(i*53)%300,1.8,1.8,'#fff');}c.globalAlpha=1;
  ['#6ef0ff','#ff7ae6','#ffe066'].forEach((col,i)=>{c.save();c.translate(130+i*270,250+Math.sin(t*2+i)*10);c.rotate(Math.sin(t+i)*.1);poly(c,[[0,-34],[22,0],[0,34],[-22,0]],col,'#fff');c.restore();});
  c.fillStyle=lgrad(c,360,450,'#3b2a8c','#1d1450');c.fillRect(0,360,800,90);
  ORDER.forEach((id,i)=>{const mood=['idle','attack','idle','win','idle','hurt'][Math.floor((t*.5+i)%6)]==='attack'?'idle':'idle';drawMon(c,id,80+i*128,418+Math.sin(t*3+i)*3,.78,t+i,false,mood);});
  const p=clamp((now-prevStart)/1500,0,1);$('#loadFill').style.width=(p*100)+'%';
  if(p>=1&&$('#btnTap').hidden){$('#btnTap').hidden=false;$('#loadTxt').textContent='พร้อมแล้ว! เปิดเสียงเพื่อประสบการณ์ที่ดีที่สุด';}
}
function drawPreview(t,now){
  const cv=$(curScreen==='team'?'#prevCvT':'#prevCvC');if(!cv||!focusId)return;
  const c=cv.getContext('2d'),W=cv.width,H=cv.height,locked=isLocked(focusId);
  c.clearRect(0,0,W,H);c.fillStyle=lgrad(c,0,H,'#eef3ff','#cfe0ff');c.fillRect(0,0,W,H);
  const ph=((now-prevStart)/1000)%6;let mood='idle',dx=0,dy=0,fl=false;
  if(ph>=2&&ph<3){mood='attack';dx=Math.sin((ph-2)*Math.PI)*40;}
  else if(ph>=3&&ph<4){mood='hurt';fl=Math.floor((ph-3)*8)%2===0;dx=Math.sin((ph-3)*40)*4;}
  else if(ph>=4&&ph<5.5){mood='win';dy=-Math.abs(Math.sin((ph-4)*7))*22;}
  if(locked){const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');drawMon(tc,focusId,W/2,H-24,1.25,t,false,'idle');tc.globalCompositeOperation='source-in';tc.fillStyle='#2a2a45';tc.fillRect(0,0,W,H);c.drawImage(tmp,0,0);}
  else drawMon(c,focusId,W/2+dx,H-24+dy,1.25,t,false,mood,{flash:fl});
  if(!locked){c.fillStyle='rgba(0,0,0,.45)';c.font='bold 12px sans-serif';c.textAlign='left';c.fillText({idle:'Idle',attack:'Attack',hurt:'Hurt',win:'Victory'}[mood],10,18);}
}
let lastEnd=0;
function drawEnd(now){
  if(endMode!=='win')return;const cv=$('#endCv'),c=cv.getContext('2d'),dt=Math.min(.05,(now-lastEnd)/1000||.016);lastEnd=now;
  c.clearRect(0,0,cv.width,cv.height);
  confetti.forEach(p=>{p.y+=p.vy*dt;p.x+=p.vx*dt;p.r+=dt*6;if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width;}c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});
}
function frame(now){
  try{
    const t=now/1000;
    if(curScreen==='title')drawTitle(t,now);
    else if(curScreen==='battle'&&B)drawBattle(t,now);
    else if(curScreen==='team'||curScreen==='collection')drawPreview(t,now);
    else if(curScreen==='end')drawEnd(now);
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  const sv=loadSave();S=mergeSave(sv);
  $('#btnTap').onclick=()=>{audio();SFX.click();updateMenu();show('menu');};
  $('#btnContinue').onclick=()=>{if(!hasGame())return;SFX.click();openArenas();};
  $('#btnNew').onclick=async()=>{
    SFX.click();
    if(hasGame()&&!(await confirmBox('เริ่มเกมใหม่? ความคืบหน้าเดิมจะถูกรีเซ็ต','เริ่มเกมใหม่')))return;
    const snd=S.sound;S=freshState();S.sound=snd;persist();openTeam();
  };
  $('#btnColl').onclick=()=>{SFX.click();renderCollection();show('collection');};
  $('#btnHow').onclick=()=>{SFX.click();showHow();};
  $('#btnSound').onclick=toggleSound;$('#btnBSound').onclick=toggleSound;
  $('#btnReset').onclick=async()=>{
    SFX.click();
    if(!(await confirmBox('ลบข้อมูลที่บันทึกไว้ทั้งหมด? ย้อนกลับไม่ได้นะ','ลบข้อมูล')))return;
    const snd=S.sound;try{localStorage.removeItem(KEY);}catch(e){}memSave=null;S=freshState();S.sound=snd;updateMenu();toast('รีเซ็ตข้อมูลเรียบร้อยแล้ว');
  };
  $('#btnCollBack').onclick=()=>{SFX.click();updateMenu();show('menu');};
  $('#btnTeamBack').onclick=()=>{SFX.click();if(hasGame())openArenas();else{updateMenu();show('menu');}};
  $('#btnStart').onclick=()=>{
    if(teamSel.length!==3)return;SFX.click();
    S.team=teamSel.slice();S.started=true;persist();openArenas();
  };
  $('#btnChangeTeam').onclick=()=>{SFX.click();openTeam();};
  $('#btnArBack').onclick=()=>{SFX.click();updateMenu();show('menu');};
  $('#btnAtk').onclick=run(doAttack);$('#btnSkill').onclick=run(doSkill);
  $('#btnSwitch').onclick=run(doSwitch);$('#btnDef').onclick=run(doDefend);
  $('#btnQuit').onclick=async()=>{
    SFX.click();if(!B||B.over){openArenas();return;}
    if(await confirmBox('ออกจากสนามนี้? ความคืบหน้าในการต่อสู้นี้จะหายไป','ออกจากสนาม')){B.dead=true;openArenas();}
  };
  prevStart=performance.now();
  requestAnimationFrame(frame);
}
boot();
